<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocStudio Bulk Image Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 420px;
      min-height: 540px;
      max-height: 600px;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 14px 16px;
      background: #181c27;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      font-size: 18px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
    }
    .server-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .server-status.offline {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.25);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .job-banner {
      padding: 12px 16px;
      background: #131722;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .job-title {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .job-meta {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: #94a3b8;
    }
    .actions-bar {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      background: #11141e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #0084ff;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0073e6;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .shots-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .shot-card {
      background: #181c27;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .shot-card.done {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.04);
    }
    .shot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shot-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      text-transform: uppercase;
    }
    .shot-status {
      font-size: 10px;
      font-weight: 600;
      color: #fbbf24;
    }
    .shot-card.done .shot-status {
      color: #10b981;
    }
    .shot-prompt {
      font-size: 11.5px;
      line-height: 1.4;
      color: #cbd5e1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .shot-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-mini {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn-mini:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-mini.copy:active {
      background: #10b981;
      color: #000;
    }
    footer {
      padding: 10px 16px;
      background: #131722;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo-icon">🎬</span>
      <h1>DocStudio Bulk AI</h1>
    </div>
    <div id="serverStatus" class="server-status">
      <span class="dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </header>

  <div class="job-banner">
    <div class="job-title" id="jobTitle">Loading project...</div>
    <div class="job-meta">
      <span id="shotCount">0 shots</span>
      <span>•</span>
      <span id="pendingCount">0 pending AI</span>
      <span>•</span>
      <span id="ratioTag">9:16 Vertical</span>
    </div>
  </div>

  <div class="actions-bar">
    <button id="btnBulkMetaAI" class="btn btn-primary">
      <span>🚀</span> Bulk Generate in Meta AI
    </button>
    <button id="btnCopyAll" class="btn btn-secondary">
      <span>📋</span> Copy Prompts
    </button>
  </div>

  <div class="shots-container" id="shotsList">
    <div class="empty-state">Fetching storyboard shots from DocStudio server...</div>
  </div>

  <footer>
    <span>DocStudio Engine v3.0</span>
    <span id="activeJobId"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
