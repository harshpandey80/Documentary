[project]
name = "docstudio"
version = "0.1.0"
description = "Autonomous Documentary Video Production Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=6.1.12",
    "pysubs2>=1.7.3",
    "google-genai>=0.1.0",
    "requests>=2.31.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "python-dotenv>=1.0.1",
    "moviepy>=2.2.1",
    "auto-editor>=29.3.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.16.0",
    "yt-dlp>=2026.8.19",
    "pyyaml>=6.0.3",
    "psutil>=7.2.2",
    "playwright>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.pytest.ini_options]
markers = [
    "google_flow: live integration tests for Google Flow browser adapter",
]
